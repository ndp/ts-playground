<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>WorldMap component example</title>
  <script type="module">
    import "../../build/world/world-map.js";
    import "../../build/world/timeline.js";
    import "../../build/world/country-summary.js";
    import "../../build/world/multi-select.js";
    import {teenyDb} from '../../build/world/teeny-db.js'

    let gLocale = document.documentElement.lang || 'en-US';
    let gCountryIso2 = null

    // Example runtime usage after component class is loaded
    window.addEventListener("DOMContentLoaded", () => {
      const wm = document.querySelector("world-map");
      if (!wm) return;


      wm.addEventListener("country-click", (ev) => {
        const detail = ev.detail
        if (gCountryIso2 === detail.iso2) {
          gLocale = null
          gCountryIso2 = null
          wm.selectCountry(null);
        } else {
          gCountryIso2 = detail.iso2;
          gLocale = teenyDb.langs(detail.iso2)[0] || 'en-US';
          wm.selectCountry(detail.iso3);
        }
        document.getElementsByTagName('locale-timeline')[0].setAttribute('locale', gLocale);
        updateNumberFormat(gLocale);
        updateListFormat(gLocale);
        updateCurrentLocale(gCountryIso2);
      });


      document.getElementById('detail').addEventListener('change', (ev) => {
        console.log('Selection changed:', ev.detail);
        wm.setLabelResolver(ev.detail.value);
      });

    });

    function updateCurrentLocale(iso2) {
      const currentLocaleEl = document.getElementById("current-locale");
      currentLocaleEl.setAttribute('data-iso2', iso2 || '');
    }

    function updateNumberFormat(gLocale) {
      if (!gLocale) return;

      const numberFormatEl = document.getElementById("number-format");

      const num1 = 1234567.89;
      const formattedNum1 = num1.toLocaleString(gLocale);
      const currencies = teenyDb.misc(gCountryIso2, 'ISO4217-currency_alphabetic_code').split(',');
      const monies = currencies.map(currency => new Intl.NumberFormat(gLocale, {style: 'currency', currency: currency}).format(1234));
      const asDollar = new Intl.NumberFormat(gLocale, {style: 'currency', currency: 'USD'}).format(1234);
      const meters = new Intl.NumberFormat(gLocale, {style: 'unit', unit: 'meter', unitDisplay: 'long'}).format(42195.01);
      const kilos = new Intl.NumberFormat(gLocale, {
        style: 'unit',
        unit: 'kilogram',
        unitDisplay: 'short'
      }).format(89.5);

      numberFormatEl.innerHTML = `
<h2>Number</h2>
<p>${formattedNum1}<p>
<h2>Local Currency</h2>
${monies.map(money => `<p>${money}</p>`).join('')}
<h2>U.S. Dollar</h2>
<p>${asDollar}</p>
<h2>Meters</h2>
<p>${meters}</p>
<h2>Kilograms</h2>
<p>${kilos}</p>`;
    }

    function updateListFormat(gLocale) {
      if (!gLocale) return;
      const listFormatEl = document.getElementById("list-format");
      if (listFormatEl) {
        const items = ['apples', 'oranges', 'bananas'];
        const cons = new Intl.ListFormat(gLocale, {type: 'conjunction'}).format(items);
        const disj = new Intl.ListFormat(gLocale, {type: 'disjunction'}).format(items);
        listFormatEl.innerHTML = `Conjunction: ${cons} <br> Disjunction: ${disj}`;
      }
    }
  </script>
  <style>
    @import url(https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap);
    @import url(https://fonts.googleapis.com/css2?family=Noto+Emoji&display=swap);
    @import url(https://fonts.googleapis.com/css2?family=Noto+Serif+Ottoman+Siyaq&display=swap);

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }

    body {
      font-family: system-ui, sans-serif;
    }

    .inset-box {
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #333;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    #number-format {
      display: grid;
      h2, p {
        margin: 0;
        padding: 0;
      }
      h2 {
        font-size: unset;
        font-weight: 100;
        font-style: italic;
        opacity: 0.7;
      }
    }

    #timeline {
      position: fixed;
      width: 100%;
      bottom: 0;
    }

  </style>
</head>
<body>
<world-map style="max-width: 100svw;max-height: 100svh">
  <!-- inset anchored to country by iso_a3 code (depends on GeoJSON id properties) -->
<!--    <div slot="inset" class="inset-box" data-country="MX">MX</div>-->
<!--    <div slot="inset" class="inset-box" data-country="CA">CA</div>-->
<!--    <div slot="inset" class="inset-box" data-country="FR">FR</div>-->
<!--    <div slot="inset" class="inset-box" data-country="DE">DE</div>-->
<!--    <div slot="inset" class="inset-box" data-country="EE">EE</div>-->
<!--    <div slot="inset" class="inset-box" data-country="BR">BR</div>-->
<!--    <div slot="inset" class="inset-box" data-country="AR">AR</div>-->
<!--    <div slot="inset" class="inset-box" data-country="CH">CH</div>-->

  <country-summary id="current-locale" slot="inset" class="inset-box" data-lon="-142" data-lat="-35"></country-summary>
  <div id="number-format" slot="inset" class="inset-box" data-lon="80" data-lat="-30"></div>
  <!--  <div id="list-format" slot="inset" class="inset-box" data-lon="-50" data-lat="30">List Format</div>-->
</world-map>
<locale-timeline id="timeline"></locale-timeline>
<multi-select id='detail' style="position: fixed; top: 0; left: 0;" >
  <div slot="option" data-value="">-</div>
  <div slot="option" data-value="iso2">AZ</div>
  <div slot="option" data-value="iso3">ABZ</div>
  <div slot="option" data-value="name">Abc...</div>
  <div slot="option" data-value="flag">FL</div>
</multi-select>
</body>
</html>
